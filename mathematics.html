<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IAL ATLAS | Mathematics</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fc;
            color: #10233f;
        }

        header {
            background: #071b36;
            padding: 18px 7%;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #071b36, #0b3c73);
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #dcecff;
            font-size: 18px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }

        .container h2 {
            margin-bottom: 30px;
            font-size: 30px;
        }

        .topics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .topic {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
        }

        .topic h3 {
            margin-bottom: 10px;
        }

        .topic p {
            color: #64748b;
            line-height: 1.6;
        }

        footer {
            background: #071b36;
            color: #b9c9dc;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 750px) {
            .topics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Back to IAL ATLAS</a>
</header>

<section class="hero">
    <h1>Mathematics</h1>
    <p>Edexcel International A Level</p>
</section>

<section class="container">

    <h2>Topics</h2>

    <div class="topics">

        <div class="topic">
            <h3>Pure Mathematics</h3>
            <p>Functions, algebra, calculus, sequences and more.</p>
        </div>

        <div class="topic">
            <h3>Statistics</h3>
            <p>Probability, distributions, hypothesis testing and data.</p>
        </div>

        <div class="topic">
            <h3>Mechanics</h3>
            <p>Forces, motion, momentum and mechanical modelling.</p>
        </div>

    </div>

</section>

<footer>
    © 2026 IAL ATLAS
</footer>

</body>
</html>
